sentence=RGB565 video on ESP32-S3 and RP2350 SPI displays, with a dual-core decode and DMA pipeline.
paragraph=Plays RV565 clips (zlib or stored RGB565 keyframes, XOR deltas and repeats; format version 7, and version 6 from RV565 1.x) on ST7789 panels, seeks in O(1) from the keyframe interval, and predicts from the file alone whether a clip will play without missed frames. Measured at 24 FPS with zero misses on the ESP32-S3 (arXiv:2610.35935) and the RP2350.
